# Settings for `art build`. This file is committed (public); private overrides go in site.local.toml.
title = "Gord Bond"
tagline = "Hamilton, Ontario - Painter"
domain = "gordbondart.com"
show_prices = true
currency = "$"
# Shown as an "Inquiries" link. Keep the real address in site.local.toml (git-ignored), not here.
contact_email = ""

# Header logo, relative to this folder. Leave blank to show the title as text instead.
logo = "logo.png"
logo_width = 260

# About page (artist statement and/or bio). Point `about` at a Markdown file to switch it on;
# leave it blank to switch it off. `about_photo` is an optional picture for the page.
about = ""
about_photo = ""

# What the sub-folders of paintings/ are called, and how they appear as filters.
category_label = "Location"

[[categories]]
key = "studio"
label = "Studio"

[[categories]]
key = "agh"
label = "AGH"
# Optional: shown as a link on each available work in this category.
link = "https://aghartsales.com/collections/gord-bond"
link_label = "View at AGH Art Sales"

# Size filters on the site, by longest side in inches (min is exclusive, max inclusive).
[[size_buckets]]
label = "Small (up to 24 in)"
max = 24

[[size_buckets]]
label = "Medium (over 24 to 40 in)"
min = 24
max = 40

[[size_buckets]]
label = "Large (over 40 in)"
min = 40
